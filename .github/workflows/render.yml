name: Render DataExplainer

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg dan gTTS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install gTTS

      - name: Buat narasi dari naskah
        run: python scripts/make-voice.py

      - name: Install dependencies
        run: npm install

      - name: Render video 1080p
        run: |
          mkdir -p out
          npx remotion render src/index.ts DataExplainer out/DataExplainer-1080p.mp4 \
            --codec=h264 --crf=23 --audio-bitrate=128k \
            --image-format=jpeg --jpeg-quality=80 \
            --concurrency=2 --overwrite

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: DataExplainer-1080p
          path: out/DataExplainer-1080p.mp4
          retention-days: 7
